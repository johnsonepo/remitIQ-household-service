# ==============================================================================
# RemitIQ Household Service
# Nginx Configuration
# ==============================================================================


server {

    listen 80;

    server_name _;


    root /var/www/html/public;

    index index.php index.html;


    charset utf-8;

    # Allow larger request bodies (e.g. file attachments on remittance
    # records, per Phase 6). Nginx's default is 1MB, which is too
    # small for most real uploads.
    client_max_body_size 20M;



    # ------------------------------------------------------------------------------
    # Laravel Front Controller
    # ------------------------------------------------------------------------------

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }



    # ------------------------------------------------------------------------------
    # PHP-FPM Processing
    # ------------------------------------------------------------------------------

    location ~ \.php$ {

        fastcgi_pass household-service:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param PATH_INFO $fastcgi_path_info;

    }



    # ------------------------------------------------------------------------------
    # Deny Hidden Files
    # ------------------------------------------------------------------------------

    location ~ /\.(?!well-known).* {

        deny all;

    }



    # ------------------------------------------------------------------------------
    # Static Asset Cache
    # ------------------------------------------------------------------------------

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {

        expires 7d;

        add_header Cache-Control "public, immutable";

    }


}
