services:

  # ============================================================================
  # Nginx Web Server
  # ============================================================================

  nginx:

    container_name: remitiq-household-nginx

    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      household-service:
        condition: service_healthy

    networks:
      - remitiq-network



  # ============================================================================
  # Laravel Household Service (PHP-FPM)
  # ============================================================================

  household-service:

    container_name: remitiq-household-service

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: household-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: ${CACHE_STORE}

      SESSION_DRIVER: ${SESSION_DRIVER}

      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      REDIS_CLIENT: ${REDIS_CLIENT}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ALGO: ${JWT_ALGO}

      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      MARKET_SERVICE_TIMEOUT: ${MARKET_SERVICE_TIMEOUT}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    healthcheck:

      test:
        [
          "CMD",
          "php",
          "artisan",
          "about"
        ]

      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:

      household-db:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - remitiq-network



  # ============================================================================
  # PostgreSQL Database
  # ============================================================================

  household-db:

    container_name: remitiq-household-db

    image: postgres:16-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${DB_DATABASE}

      POSTGRES_USER: ${DB_USERNAME}

      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:

      - household-postgres-data:/var/lib/postgresql/data

    ports:

      - "5433:5432"


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - remitiq-network



  # ============================================================================
  # Redis
  # ============================================================================

  redis:

    container_name: remitiq-household-redis

    image: redis:7-alpine

    restart: unless-stopped

    ports:

      - "6379:6379"


    volumes:

      - redis-data:/data


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:

      - remitiq-network



  # ============================================================================
  # Mail Testing
  # ============================================================================

  mailpit:

    container_name: remitiq-mailpit

    image: axllent/mailpit:latest

    restart: unless-stopped

    ports:

      - "8025:8025"

      - "1025:1025"


    networks:

      - remitiq-network



# ==============================================================================
# Volumes
# ==============================================================================

volumes:

  household-postgres-data:

  redis-data:

  vendor:



# ==============================================================================
# Network
# ==============================================================================

networks:

  remitiq-network:

    driver: bridge
